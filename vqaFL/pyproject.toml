[project]
name = "vqa-fl-qwen"
version = "0.1.0"
description = "Closed-ended medical VQA federated LoRA experiments with Qwen3-VL and CAA aggregation."
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.2.0",
    "pillow>=10.0.0",
    "transformers>=4.57.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "peft>=0.12.0",
    "qwen-vl-utils>=0.0.14",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.43.0"]

[project.scripts]
vqa-fl = "vqa_fl.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

