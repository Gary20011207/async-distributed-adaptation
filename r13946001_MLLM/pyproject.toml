[project]
name = "fed-mllm-clockless"
version = "0.1.0"
description = "Clockless asynchronous federated adaptation for closed-ended LLM/MLLM tasks."
requires-python = ">=3.10,<3.14"
dependencies = [
    "flwr>=1.8.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.0",
    "transformers>=4.50.0",
    "datasets>=2.18.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0; platform_system == 'Linux'",
    "qwen-vl-utils>=0.0.8",
]

[project.scripts]
fed-mllm = "fed_mllm.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
